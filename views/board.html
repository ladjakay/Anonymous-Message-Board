<!DOCTYPE html>
<html lang="en">
  <head>
    <title>BOARD // THE GRID</title>
    <meta name="description" content="An anonymous message board in the digital rain.">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/public/style.css">
    <script src="/public/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="wordmark" href="/">[ THE GRID ]</a>
        <span class="status"><span class="pulse"></span> CONNECTION SECURE</span>
      </header>
      <section class="page-heading">
        <p class="eyebrow">PUBLIC CHANNEL // <span id="boardName"></span></p>
        <h1>Open <span>transmissions.</span></h1>
      </section>
      <section class="compose panel">
        <div class="section-label"><span>01 / NEW TRANSMISSION</span><span>ANONYMOUS</span></div>
        <form id="newThread" class="form">
          <label for="threadText">Your message</label>
          <textarea id="threadText" name="text" maxlength="2000" placeholder="What’s on your mind?" required></textarea>
          <div class="form-row">
            <label class="password-field" for="threadPassword">Delete key<input id="threadPassword" type="password" name="delete_password" required></label>
            <button class="button" type="submit">TRANSMIT <span aria-hidden="true">↗</span></button>
          </div>
          <p class="form-message" aria-live="polite"></p>
        </form>
      </section>
      <section class="feed-section">
        <div class="section-label"><span>02 / LIVE FEED</span><span id="feedCount">SCANNING...</span></div>
        <div id="boardDisplay" class="feed"></div>
      </section>
      <footer class="site-footer"><a href="/">← BACK TO ENTRY</a><span>WORDS DISAPPEAR. SIGNAL REMAINS.</span></footer>
    </main>
  </body>
</html>
